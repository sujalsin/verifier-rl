<svg xmlns="http://www.w3.org/2000/svg" width="950" height="455" viewBox="0 0 950 455" role="img">
<title>Paired final checkpoint effects and exploratory uncertainty</title><desc>Four seed differences per contrast and a model-based paired t interval with three degrees of freedom.</desc>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#172033} .small{font-size:12px} .label{font-size:14px} .title{font-size:19px;font-weight:bold}</style>
