name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      # Official Python CI guide: https://docs.github.com/en/actions/tutorials/build-and-test-code/python
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and mocked-provider test dependency
        run: python -m pip install -e '.[test]'
      - name: Repository checks
        run: make check
      - name: Offline demo and regression suite
        run: make demo test
      - name: Portable publication arithmetic
        run: make publication
