experiment:
  name: "condition_B3_weak_undercoverage"
  condition: "B3_undercoverage"
  seed: 42

model:
  name: "Qwen/Qwen2.5-Coder-0.5B-Instruct"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

grpo:
  num_steps: 1000
  group_size: 4
  temperature: 0.8
  beta_kl: 0.04
  clip_epsilon: 0.2
  learning_rate: 5.0e-5
  checkpoint_interval: 200
  seed_dose_rate: 0.0
  exploit_type: "undercoverage"

data:
  train_path: "data/tasks/train.json"
  eval_path: "data/tasks/heldout_instances.json"
  heldout_families_path: "data/tasks/heldout_families.json"

output_dir: "experiments/results/condition_B3_weak_undercoverage"
